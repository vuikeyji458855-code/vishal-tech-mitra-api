
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7ff">
<meta name="description" content="Vishal Tech Mitra - आपका AI साथी">
<title>Vishal Tech Mitra AI</title>

<style>
:root{
  --bg:#f4f6ff;
  --panel:#ffffff;
  --text:#18213b;
  --muted:#7c859b;
  --border:#e3e8f4;
  --accent:#2867f5;
  --purple:#6043e8;
  --user:#e7edff;
  --shadow:0 8px 30px rgba(35,65,140,.07);
}
body.dark{
  --bg:#0c1120;
  --panel:#151c2d;
  --text:#f0f3ff;
  --muted:#a1abc2;
  --border:#2a344a;
  --user:#202e50;
  --shadow:0 8px 30px rgba(0,0,0,.15);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;
  height:100dvh;overflow:hidden;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column;max-width:1000px;margin:auto}
.header{
  display:flex;align-items:center;gap:12px;padding:12px 15px;
  background:var(--panel);border-bottom:1px solid var(--border);
}
.iconbtn{
  width:48px;height:48px;flex-shrink:0;border:1px solid var(--border);
  border-radius:17px;background:var(--panel);color:var(--text);
  font-size:25px;display:grid;place-items:center;
}
.logo{
  width:55px;height:55px;flex-shrink:0;border-radius:19px;
  background:linear-gradient(140deg,#1685ff,#6540e8);
  color:white;display:grid;place-items:center;font-size:35px;
  box-shadow:0 8px 20px #514de52a;
}
.brand{min-width:0;flex:1}
.brand h1{font-size:19px;margin:0;white-space:nowrap}
.brand p{font-size:13px;color:var(--muted);margin:3px 0 0}
.header-actions{display:flex;gap:8px}
.main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.messages{
  flex:1;overflow-y:auto;padding:22px 16px 28px;
  scroll-behavior:smooth;
}
.welcome{max-width:650px;margin:40px auto;text-align:center}
.biglogo{
  width:112px;height:112px;margin:auto auto 24px;border-radius:33px;
  background:linear-gradient(140deg,#1685ff,#6540e8);
  display:grid;place-items:center;color:white;font-size:69px;
  box-shadow:0 18px 45px #514de526;
}
.welcome h2{font-size:clamp(27px,6vw,39px);line-height:1.35;margin:0 0 17px}
.welcome>p{font-size:17px;line-height:1.8;color:var(--muted);margin:0 auto 30px}
.suggestions{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;text-align:left;
}
.suggestion{
  padding:17px;border:1px solid var(--border);border-radius:23px;
  background:var(--panel);color:var(--text);text-align:left;
  box-shadow:var(--shadow);min-height:112px;
}
.suggestion .emoji{font-size:28px;display:block;margin-bottom:10px}
.suggestion strong{display:block;font-size:16px;margin-bottom:6px}
.suggestion small{color:var(--muted);font-size:13px;line-height:1.6}
.message{display:flex;margin:16px auto;max-width:760px;gap:10px;align-items:flex-start}
.message.user{flex-direction:row-reverse}
.avatar{
  width:34px;height:34px;border-radius:12px;flex-shrink:0;
  display:grid;place-items:center;background:linear-gradient(140deg,#1685ff,#6540e8);
  color:white;font-weight:bold;
}
.bubble{
  max-width:calc(100% - 45px);min-width:0;padding:13px 16px;
  border:1px solid var(--border);border-radius:18px;
  background:var(--panel);white-space:pre-wrap;overflow-wrap:anywhere;
  line-height:1.7;box-shadow:var(--shadow);
}
.user .bubble{background:var(--user)}
.bubble img{max-width:100%;max-height:260px;object-fit:contain;border-radius:12px;display:block;margin-bottom:8px}
.bubble-actions{display:flex;gap:8px;margin-top:9px}
.bubble-actions button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:4px}
.typing{color:var(--muted);font-size:14px}
.composer-area{padding:0 14px calc(8px + env(safe-area-inset-bottom))}
.composer{
  background:var(--panel);border:1px solid var(--border);
  border-radius:28px;padding:10px;box-shadow:var(--shadow);
}
.preview{display:none;padding:6px 8px 10px;position:relative}
.preview img{width:80px;height:80px;object-fit:cover;border-radius:13px}
.remove-image{
  position:absolute;top:0;left:75px;border:0;border-radius:50%;
  background:#e33;color:white;width:25px;height:25px;
}
.input-row{display:flex;align-items:flex-end;gap:8px}
.attach{
  width:43px;height:45px;border:0;border-radius:15px;background:transparent;
  color:var(--muted);font-size:29px;flex-shrink:0;
}
#prompt{
  flex:1;min-width:0;max-height:130px;resize:none;border:0;outline:0;
  background:transparent;color:var(--text);padding:11px 3px;
  font-size:16px;line-height:1.5;
}
#prompt::placeholder{color:var(--muted)}
.send{
  width:49px;height:49px;flex-shrink:0;border:0;border-radius:17px;
  background:linear-gradient(140deg,#1685ff,#6540e8);
  color:white;font-size:27px;display:grid;place-items:center;
}
.send:disabled{opacity:.5;cursor:wait}
.hint{text-align:center;color:var(--muted);font-size:12px;padding:10px 4px 0}
.status{text-align:center;color:var(--muted);font-size:12px;margin-top:5px}
.drawer{
  display:none;position:absolute;z-index:5;inset:0;background:var(--bg);
  overflow-y:auto;padding:18px;
}
.drawer.open{display:block}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.drawer h3{margin:0}
.history-item{
  width:100%;text-align:left;padding:13px;margin:5px 0;
  border:1px solid var(--border);border-radius:14px;
  background:var(--panel);color:var(--text);overflow-wrap:anywhere;
}
.empty-history{color:var(--muted);font-size:14px}
.hidden{display:none!important}
@media(min-width:700px){
  .header{padding:15px 22px}
  .messages{padding:28px}
  .composer-area{padding-left:24px;padding-right:24px}
  .welcome{margin-top:48px}
}
@media(max-width:380px){
  .header{gap:7px;padding:9px}
  .logo{width:43px;height:43px;font-size:27px;border-radius:15px}
  .iconbtn{width:40px;height:42px;border-radius:14px}
  .header-actions{gap:5px}
  .brand h1{font-size:15px}
  .brand p{font-size:11px}
  .suggestion{padding:12px}
}
</style>
</head>

<body>
<div class="app">
  <header class="header">
    <button class="iconbtn" id="historyBtn" aria-label="Chat history">☰</button>
    <div class="logo">✦</div>
    <div class="brand">
      <h1>Vishal Tech Mitra</h1>
      <p>आपका AI साथी</p>
    </div>
    <div class="header-actions">
      <button class="iconbtn" id="themeBtn" aria-label="Theme">☾</button>
      <button class="iconbtn" id="newBtn" aria-label="New chat">＋</button>
    </div>
  </header>

  <main class="main">
    <div class="messages" id="messages">
      <section class="welcome" id="welcome">
        <div class="biglogo">✦</div>
        <h2>नमस्ते! 👋<br>मैं हूँ Vishal Tech Mitra</h2>
        <p>आपका AI साथी — पढ़ाई, टेक्नोलॉजी, लेखन और नए आइडिया के लिए हमेशा तैयार।</p>
        <div class="suggestions">
          <button class="suggestion" data-prompt="मुझे मेरी पढ़ाई में मदद करो।">
            <span class="emoji">🎓</span>
            <strong>पढ़ाई में मदद</strong>
            <small>कठिन विषय आसान भाषा में</small>
          </button>
          <button class="suggestion" data-prompt="मुझे मोबाइल से वेबसाइट बनाना सिखाओ।">
            <span class="emoji">💻</span>
            <strong>कोडिंग सीखें</strong>
            <small>वेबसाइट और ऐप के आइडिया</small>
          </button>
          <button class="suggestion" data-prompt="इस विषय को आसान हिंदी में समझाओ: आर्टिफिशियल इंटेलिजेंस।">
            <span class="emoji">💡</span>
            <strong>आसान समझ</strong>
            <small>जटिल सवालों के सरल जवाब</small>
          </button>
          <button class="suggestion" data-prompt="मुझे एक नया और उपयोगी टेक्नोलॉजी प्रोजेक्ट सुझाओ।">
            <span class="emoji">🚀</span>
            <strong>नए आइडिया</strong>
            <small>नए प्रोजेक्ट की शुरुआत</small>
          </button>
        </div>
      </section>
    </div>

    <aside class="drawer" id="drawer">
      <div class="drawer-head">
        <h3>💬 चैट हिस्ट्री</h3>
        <button class="iconbtn" id="closeDrawer" aria-label="Close">×</button>
      </div>
      <button class="history-item" id="drawerNew">＋ नई चैट</button>
      <div id="historyList"></div>
      <p class="empty-history" id="historyEmpty">अभी कोई पुरानी चैट नहीं है।</p>
    </aside>
  </main>

  <footer class="composer-area">
    <div class="composer">
      <div class="preview" id="preview">
        <img id="previewImg" alt="चुनी गई फोटो">
        <button class="remove-image" id="removeImage" aria-label="Remove image">×</button>
      </div>
      <div class="input-row">
        <button class="attach" id="attachBtn" aria-label="Attach photo">＋</button>
        <input type="file" id="fileInput" accept="image/*" class="hidden">
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
        <textarea id="prompt" rows="1" placeholder="अपना सवाल लिखें..." aria-label="Your message"></textarea>
        <button class="attach" id="cameraBtn" aria-label="Take photo">📷</button>
        <button class="send" id="sendBtn" aria-label="Send message">➤</button>
      </div>
    </div>
    <div class="hint">📎 फोटो जोड़ें · हिंदी / English</div>
    <div class="status" id="status">AI साथी तैयार है</div>
  </footer>
</div>

<script>
(() => {
  "use strict";

  const API_URL = "/api/chat";
  const STORE_KEY = "vtm_chats_v2";
  const THEME_KEY = "vtm_theme_v1";

  const $ = id => document.getElementById(id);
  const messagesEl = $("messages");
  const welcome = $("welcome");
  const promptEl = $("prompt");
  const sendBtn = $("sendBtn");
  const statusEl = $("status");

  let chats = loadChats();
  let currentId = makeId();
  let currentMessages = [];
  let selectedImage = null;
  let busy = false;

  function makeId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  function loadChats() {
    try {
      const value = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
      return Array.isArray(value) ? value : [];
    } catch (_) {
      return [];
    }
  }

  function saveChats() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(chats.slice(0,30)));
    } catch (_) {
      statusEl.textContent = "चैट सेव नहीं हो पाई। फोन में स्टोरेज कम हो सकता है।";
    }
  }

  function applyTheme(dark) {
    document.body.classList.toggle("dark", dark);
    $("themeBtn").textContent = dark ? "☀" : "☾";
    document.querySelector('meta[name="theme-color"]').content =
      dark ? "#0c1120" : "#f5f7ff";
    try { localStorage.setItem(THEME_KEY, dark ? "dark" : "light"); } catch (_) {}
  }

  try {
    applyTheme(localStorage.getItem(THEME_KEY) === "dark");
  } catch (_) {
    applyTheme(false);
  }

  $("themeBtn").addEventListener("click", () => {
    applyTheme(!document.body.classList.contains("dark"));
  });

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showWelcome(show) {
    welcome.classList.toggle("hidden", !show);
  }

  function addMessage(role, text, imageUrl = null) {
    showWelcome(false);

    const wrap = document.createElement("div");
    wrap.className = "message " + (role === "user" ? "user" : "assistant");

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "V" : "✦";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if (imageUrl) {
      const img = document.createElement("img");
      img.src = imageUrl;
      img.alt = "अपलोड की गई फोटो";
      bubble.appendChild(img);
    }

    if (text) {
      const content = document.createElement("div");
      content.textContent = text;
      bubble.appendChild(content);
    }

    wrap.append(avatar, bubble);
    messagesEl.appendChild(wrap);
    scrollBottom();
    return {wrap, bubble};
  }

  function addTyping() {
    const item = addMessage("assistant", "जवाब तैयार हो रहा है…");
    item.bubble.querySelector("div").className = "typing";
    return item.wrap;
  }

  function saveCurrentChat() {
    if (!currentMessages.length) return;

    const first = currentMessages.find(m => m.role === "user");
    const title = first ? first.text.slice(0,55) : "नई चैट";
    const entry = {
      id: currentId,
      title,
      updatedAt: Date.now(),
      messages: currentMessages
    };

    chats = chats.filter(c => c.id !== currentId);
    chats.unshift(entry);
    saveChats();
  }

  function renderHistory() {
    const list = $("historyList");
    list.replaceChildren();
    $("historyEmpty").classList.toggle("hidden", chats.length > 0);

    chats.forEach(chat => {
      const button = document.createElement("button");
      button.className = "history-item";
      button.textContent = "💬 " + (chat.title || "चैट");
      button.addEventListener("click", () => openChat(chat.id));
      list.appendChild(button);
    });
  }

  function openChat(id) {
    const chat = chats.find(c => c.id === id);
    if (!chat) return;

    currentId = chat.id;
    currentMessages = Array.isArray(chat.messages) ? chat.messages : [];
    messagesEl.querySelectorAll(".message").forEach(el => el.remove());
    showWelcome(currentMessages.length === 0);

    currentMessages.forEach(m => {
      addMessage(m.role, m.text || "", m.imageUrl || null);
    });

    $("drawer").classList.remove("open");
    statusEl.textContent = "पुरानी चैट खोली गई";
  }

  function newChat() {
    if (busy) return;
    saveCurrentChat();
    currentId = makeId();
    currentMessages = [];
    messagesEl.querySelectorAll(".message").forEach(el => el.remove());
    showWelcome(true);
    clearImage();
    promptEl.value = "";
    $("drawer").classList.remove("open");
    statusEl.textContent = "नई चैट तैयार है";
    renderHistory();
  }

  $("newBtn").addEventListener("click", newChat);
  $("drawerNew").addEventListener("click", newChat);
  $("historyBtn").addEventListener("click", () => {
    renderHistory();
    $("drawer").classList.add("open");
  });
  $("closeDrawer").addEventListener("click", () => {
    $("drawer").classList.remove("open");
  });

  function resizePrompt() {
    promptEl.style.height = "auto";
    promptEl.style.height = Math.min(promptEl.scrollHeight,130) + "px";
  }

  promptEl.addEventListener("input", resizePrompt);
  promptEl.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  document.querySelectorAll(".suggestion").forEach(button => {
    button.addEventListener("click", () => {
      promptEl.value = button.dataset.prompt || "";
      resizePrompt();
      sendMessage();
    });
  });

  $("attachBtn").addEventListener("click", () => $("fileInput").click());
  $("cameraBtn").addEventListener("click", () => $("cameraInput").click());

  function clearImage() {
    selectedImage = null;
    $("fileInput").value = "";
    $("cameraInput").value = "";
    $("preview").style.display = "none";
    $("previewImg").removeAttribute("src");
  }

  function readImage(file) {
    if (!file) return;
    if (!file.type.startsWith("image/")) {
      statusEl.textContent = "कृपया फोटो फाइल चुनें।";
      return;
    }
    if (file.size > 8 * 1024 * 1024) {
      statusEl.textContent = "फोटो 8 MB से छोटी चुनें।";
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      selectedImage = reader.result;
      $("previewImg").src = selectedImage;
      $("preview").style.display = "block";
      statusEl.textContent = "फोटो जोड़ दी गई है";
    };
    reader.onerror = () => {
      statusEl.textContent = "फोटो पढ़ी नहीं जा सकी। दोबारा कोशिश करें।";
    };
    reader.readAsDataURL(file);
  }

  $("fileInput").addEventListener("change", e => readImage(e.target.files[0]));
  $("cameraInput").addEventListener("change", e => readImage(e.target.files[0]));
  $("removeImage").addEventListener("click", clearImage);

  function extractReply(data) {
    if (typeof data === "string") return data;
    if (!data || typeof data !== "object") return "";

    if (typeof data.reply === "string") return data.reply;
    if (typeof data.text === "string") return data.text;
    if (typeof data.response === "string") return data.response;
    if (typeof data.message === "string") return data.message;

    const parts = data.candidates?.[0]?.content?.parts;
    if (Array.isArray(parts)) {
      return parts.map(p => p.text || "").join("\n").trim();
    }

    return "";
  }

  async function sendMessage() {
    if (busy) return;

    const text = promptEl.value.trim();
    const image = selectedImage;

    if (!text && !image) {
      promptEl.focus();
      statusEl.textContent = "पहले अपना सवाल लिखें या फोटो जोड़ें।";
      return;
    }

    busy = true;
    sendBtn.disabled = true;
    statusEl.textContent = "AI से संपर्क हो रहा है…";

    const userText = text || "इस फोटो को देखकर समझाइए।";
    addMessage("user", userText, image);

    currentMessages.push({
      role:"user",
      text:userText,
      imageUrl:image || null
    });

    promptEl.value = "";
    resizePrompt();
    clearImage();

    const typing = addTyping();

    try {
      const payload = {message:userText};
      if (image) payload.imageBase64 = image;

      const response = await fetch(API_URL, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(payload)
      });

      const raw = await response.text();
      let data;
      try { data = JSON.parse(raw); }
      catch (_) { data = {reply:raw}; }

      if (!response.ok) {
        const detail = data?.error || data?.message ||
          ("HTTP " + response.status);
        throw new Error(detail);
      }

      const reply = extractReply(data);
      if (!reply) {
        throw new Error("सर्वर से जवाब नहीं मिला। API का response format जाँचें।");
      }

      typing.remove();
      addMessage("assistant", reply);
      currentMessages.push({role:"assistant", text:reply});
      saveCurrentChat();
      renderHistory();
      statusEl.textContent = "जवाब मिल गया";
    } catch (error) {
      typing.remove();
      const message = error?.message || "अज्ञात त्रुटि";

      addMessage(
        "assistant",
        "माफ़ कीजिए, अभी जवाब नहीं मिल पाया।\n\n" +
        "समस्या: " + message +
        "\n\nVercel पर /api/chat फ़ंक्शन, Gemini API Key और Runtime Logs जाँचें।"
      );

      statusEl.textContent = "कनेक्शन या API में समस्या";
    } finally {
      busy = false;
      sendBtn.disabled = false;
      promptEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  renderHistory();
})();
</script>
</body>
</html>
